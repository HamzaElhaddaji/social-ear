services:
  app:
    build:
      context: .
      args:
        INSTALL_MODELS: ${INSTALL_MODELS:-0}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://socialear:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/socialear
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      ENABLE_BLUESKY: ${ENABLE_BLUESKY:-0}
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-baseline}
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-extractive}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ./data/models:/srv/social-ear/data/models:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: socialear
      POSTGRES_DB: socialear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialear -d socialear"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
